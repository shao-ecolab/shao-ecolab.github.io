name: deploy

on:
  push:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 18.x

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install feedgen pyyaml

      - name: Install MyST Markdown
        run: npm install -g mystmd

      - name: Build HTML Assets
        # Served at the org root (shao-ecolab.github.io), so no BASE_URL prefix.
        # If this ever moves to a project repo, set BASE_URL: /${{ github.event.repository.name }}
        run: myst build --html

      - name: Generate RSS and Atom feeds
        run: python generate_rss.py

      - name: Rewrite localhost URLs in sitemap and robots.txt
        # MyST stamps the dev-server origin into both files. The sitemap was
        # already fixed here; robots.txt was not, so its Sitemap: line pointed
        # crawlers at http://localhost:3000/sitemap.xml and led nowhere.
        run: |
          for f in sitemap.xml robots.txt; do
            if [ -f "./_build/html/$f" ]; then
              sed -i 's|http://localhost:[0-9]*|https://shao-ecolab.github.io|g' "./_build/html/$f"
            fi
          done

      - name: Fix og:image (absolute URL, JPEG variant)
        # Open Graph requires absolute URLs; MyST emits a site-relative path,
        # which Slack/LinkedIn/Bluesky cannot resolve, so previews come blank.
        # MyST also rewrites the declared JPEG thumbnail to WebP, which LinkedIn
        # renders poorly - it emits a JPEG twin at the same hash, so point at it.
        run: |
          find ./_build/html -name "*.html" -exec \
            sed -i 's|\(<meta property="og:image" content="\)/|\1https://shao-ecolab.github.io/|g' {} +
          find ./_build/html -name "*.html" -exec \
            sed -i 's|\(<meta property="og:image" content="[^"]*lab-banner-social[^"]*\)\.webp"|\1.jpg"|g' {} +

      - name: Inject Giscus comments into blog posts
        run: python inject_comments.py

      - name: Copy static files and rewrite CV URL to stable path
        run: |
          cp CNAME ./_build/html/ 2>/dev/null || true
          cp cv.pdf ./_build/html/cv.pdf
          # Rewrite hashed CV URL to stable /cv.pdf path
          find ./_build/html -name "*.html" -exec sed -i 's|/build/cv-[a-f0-9]\{20,\}\.pdf|/cv.pdf|g' {} \;

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./_build/html"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
