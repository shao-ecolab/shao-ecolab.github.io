version: 1
project:
  title: Home
  thumbnail: pages/images/lab-banner-social.jpg
  description: The Shao EcoLab at the University of Tennessee, Knoxville builds process-based ecosystem models in which microbes are active players, linking microbial traits to ecosystem carbon and nutrient cycling.
  authors:
    - name: Siya Shao
      email: sshao3@utk.edu
      orcid: 0000-0001-8293-3450
      url: https://shao-ecolab.github.io
      affiliations:
        - Department of Microbiology, University of Tennessee, Knoxville
  copyright: '2026'
  keywords:
    - Ecosystem Modeling
    - Soil Microbial Ecology
    - Mycorrhizal Fungi
    - Peatlands
    - Biogeochemistry
    - Enhanced Rock Weathering
    - Carbon Cycling
  github: shao-ecolab/shao-ecolab.github.io
  exclude:
    - _build
    - Thumbs.db
    - .DS_Store
    - '**.ipynb_checkpoints'
    - cv.typ
    - cv.pdf
